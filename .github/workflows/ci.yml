name: CI Pipeline

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main, master]

jobs:
  verify:
    name: Validate, Migrate, Seed, Lint, Typecheck, Test, Build, E2E (PostgreSQL 16)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: admin
          POSTGRES_DB: biznet
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      CI: "true"
      DATABASE_URL: "postgresql://postgres:admin@localhost:5432/biznet"
      TEST_DATABASE_URL: "postgresql://postgres:admin@localhost:5432/biznet_test"
      SESSION_SECRET: "ci-only-session-secret-0123456789abcdef0123456789abcdef"
      TRUST_PROXY: "nginx"
      APP_URL: "http://localhost:3000"
      SMS_PROVIDER: "console"
      AI_PROVIDER: "mock"
      STT_PROVIDER: "mock"
      TRANSLATION_PROVIDER: "mock"
      ADMIN_EMAILS: "admin@biznet.com"
      DEV_TEST_PHONES: "+8801700000001,+8801700000002"
      STORAGE_DRIVER: "s3"
      S3_ENDPOINT: "http://127.0.0.1:9000" # not localhost: Node 22 resolves it to ::1
      S3_ACCESS_KEY: "minioadmin"
      S3_SECRET_KEY: "minioadmin"
      S3_BUCKET_PUBLIC: "biznet-public"
      S3_BUCKET_PRIVATE: "biznet-private"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # pnpm/action-setup's self-installer fails for pnpm 12; install the version
      # pinned in package.json "packageManager" with npm instead.
      - name: Install pnpm
        run: npm install -g pnpm@$(node -p "require('./package.json').packageManager.split('@')[1]")

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      # The minio/minio Docker Hub image is no longer published; moto provides an
      # S3-compatible server for CI without docker.
      - name: Start S3-compatible server (moto)
        run: |
          python3 -m venv /tmp/moto
          /tmp/moto/bin/pip install --quiet "moto[server]==5.2.4"
          nohup /tmp/moto/bin/moto_server -H 127.0.0.1 -p 9000 > /tmp/moto.log 2>&1 &
          for i in $(seq 1 30); do curl -s -o /dev/null http://127.0.0.1:9000 && exit 0; sleep 1; done
          cat /tmp/moto.log
          exit 1

      - name: Create S3 Buckets
        run: npx tsx scripts/ensure-buckets.ts

      - name: Prisma Validate
        run: npx prisma validate

      - name: Migration Reset + Seed (§16)
        run: npx prisma migrate reset --force

      - name: Verify Foreign Key Indexes
        run: npx tsx scripts/check-fk-indexes.ts

      - name: TypeScript Static Typecheck
        run: npx tsc --noEmit

      - name: Strict ESLint CI Check
        run: pnpm lint:ci

      - name: Integration Tests (separate test database)
        run: pnpm test

      - name: Build Production Application Bundle
        run: pnpm build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Playwright E2E (360x740)
        run: pnpm test:e2e

      - name: Upload Playwright Results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: test-results/

  compose-demo:
    name: docker compose up + pnpm db:seed gives a working demo (§16)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the app image
        run: |
          set -o pipefail
          if ! docker compose build app 2>&1 | tee /tmp/build.log; then
            # Surface the failure as annotations (readable without downloading logs)
            tail -n 40 /tmp/build.log | while IFS= read -r line; do echo "::error title=docker build::${line}"; done
            exit 1
          fi

      - name: Start postgres, s3, app
        run: docker compose up -d postgres s3 app

      - name: Wait for /api/health
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:3000/api/health; then echo; exit 0; fi
            sleep 5
          done
          docker compose logs app | tail -n 40 | while IFS= read -r line; do echo "::error title=app logs::${line}"; done
          exit 1

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm and dependencies (host, for the seed)
        run: |
          npm install -g pnpm@$(node -p "require('./package.json').packageManager.split('@')[1]")
          pnpm install --frozen-lockfile

      - name: pnpm db:seed against the compose database
        env:
          DATABASE_URL: postgresql://postgres:admin@localhost:5432/biznet
        run: pnpm db:seed

      - name: Demo pages respond with seeded data
        run: |
          curl -fsS http://localhost:3000/api/health | tee /dev/stderr | grep -q '"status":"ok"'
          curl -fsS "http://localhost:3000/api/search?q=box&verified=0" | grep -q "বক্স"
          curl -fsS http://localhost:3000/api/prices | grep -q '"categorySlug":"containers"'
          curl -fsS -o /dev/null -w "%{http_code}\n" http://localhost:3000/login | grep -q 200

      - name: Start the worker
        run: |
          docker compose up -d worker
          sleep 20
          docker compose logs worker | grep -q "worker] started"

      - name: Compose logs on failure
        if: failure()
        run: docker compose logs
