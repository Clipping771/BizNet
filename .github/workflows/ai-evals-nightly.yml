name: AI Evals Nightly

# Real-provider AI evals (§12): scheduled and non-blocking. Uses the provider named in the
# AI_PROVIDER secret (mock when unset) against a fresh PostgreSQL 16 test database.
on:
  schedule:
    - cron: "0 2 * * *" # 08:00 Asia/Dhaka
  workflow_dispatch:

jobs:
  ai-evals:
    runs-on: ubuntu-latest
    continue-on-error: true

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: admin
          POSTGRES_DB: biznet
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: "postgresql://postgres:admin@localhost:5432/biznet"
      TEST_DATABASE_URL: "postgresql://postgres:admin@localhost:5432/biznet_test"
      SESSION_SECRET: "ci-only-session-secret-0123456789abcdef0123456789abcdef"
      STORAGE_DRIVER: "memory"
      AI_PROVIDER: ${{ secrets.AI_PROVIDER || 'mock' }}
      AI_API_KEY: ${{ secrets.AI_API_KEY }}
      STT_PROVIDER: ${{ secrets.STT_PROVIDER || 'mock' }}
      STT_API_KEY: ${{ secrets.STT_API_KEY }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Same as ci.yml: install the pnpm version pinned in package.json
      - name: Install pnpm
        run: npm install -g pnpm@$(node -p "require('./package.json').packageManager.split('@')[1]")

      - run: pnpm install --frozen-lockfile

      - name: Run AI evals
        run: pnpm vitest run tests/ai-evals
