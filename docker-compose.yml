# Local demo: `docker compose up --build`, then `pnpm db:seed` on the host → http://localhost:3000
#
# S3: the minio/minio image is no longer published on Docker Hub, so local S3 uses moto (the same
# S3-compatible server CI uses). moto keeps objects in memory — uploads are lost when the container
# restarts. Production uses Cloudflare R2 or any S3 bucket via the S3_* variables.
services:
  postgres:
    image: postgres:16-alpine
    container_name: biznet-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: biznet
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  s3:
    image: motoserver/moto:5.0.28
    container_name: biznet-s3
    restart: always
    ports:
      - "9000:5000"

  app:
    build: .
    container_name: biznet-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      s3:
        condition: service_started
    ports:
      - "3000:3000"
    environment: &app-env
      DATABASE_URL: postgresql://postgres:admin@postgres:5432/biznet
      APP_URL: http://localhost:3000
      SESSION_SECRET: local-demo-session-secret-change-me-0123456789
      TRUST_PROXY: "none"
      SMS_PROVIDER: console
      AI_PROVIDER: mock
      STT_PROVIDER: mock
      TRANSLATION_PROVIDER: mock
      STORAGE_DRIVER: s3
      S3_ENDPOINT: http://s3:5000
      S3_ACCESS_KEY: test
      S3_SECRET_KEY: test
      S3_BUCKET_PUBLIC: biznet-public
      S3_BUCKET_PRIVATE: biznet-private
      DEV_TEST_PHONES: "+8801700000001,+8801700000002"
      ADMIN_PHONES: "+8801700000001"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30

  worker:
    build: .
    container_name: biznet-worker
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    environment: *app-env
    command: ["pnpm", "worker"]

volumes:
  postgres_data:
